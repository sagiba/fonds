name: Check

# Pull requests are the merge gate. Main is not rechecked on every merge: a
# nightly run there catches breaks between pull requests that passed alone and
# refreshes the npm and Docker caches that pull requests read from main.
on:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A documentation-only change (Markdown and its budget) needs only formatting,
  # the offline link check, the public-text check and the documentation budget;
  # this job runs them and the other jobs are skipped without a runner. A
  # skipped job satisfies a required check, so this job is required too: a
  # failure here blocks the merge. A change touching only tests and
  # documentation skips the image builds. Scheduled and manual runs, a missing
  # base or a git failure leave the outputs unset: everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect documentation-only changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] &&
            git fetch --quiet --depth=1 origin "$BASE" &&
            files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD) &&
            [ -n "$files" ]; then
            # Count the other files, so a grep error is not read as none.
            docs='\.md$|^docs/doc-budget\.json$'
            if [ "$(grep -cvE "$docs" <<<"$files")" = 0 ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$(grep -cvE "$docs|^tests/" <<<"$files")" = 0 ]; then
              echo "docker=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.changes.outputs.code == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.code == 'false'
        run: npm ci
      - if: steps.changes.outputs.code == 'false'
        run: npm run format:check
      - if: steps.changes.outputs.code == 'false'
        run: npm run check:links
      - if: steps.changes.outputs.code == 'false'
        run: npm run check:public-text
      - if: steps.changes.outputs.code == 'false'
        run: npm run check:doc-budget

  check:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  postgres:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FONDS_TEST_POSTGRES_URL: postgres://postgres:synthetic-test-only@127.0.0.1:5432/postgres
      FONDS_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A disposable server started without JIT, which fresh test databases
      # without statistics trigger on tiny queries, and without durability,
      # which a throwaway server does not need. Service containers cannot
      # take server arguments. TCP readiness skips the image's init server.
      - name: Start a disposable PostgreSQL
        run: |
          docker run -d --name fonds-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD=synthetic-test-only postgres:18.6 \
            -c jit=off -c synchronous_commit=off -c fsync=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            docker exec fonds-postgres pg_isready -h 127.0.0.1 -U postgres -d postgres && exit 0
            sleep 1
          done
          exit 1
      # Two files at a time; each case has its own database.
      - name: Run storage integration tests
        run: >-
          npx vitest run tests/storage --maxWorkers=2
          --reporter=default --reporter=json
          --outputFile=/tmp/fonds-postgres-results.json
      - name: Verify PostgreSQL coverage ran
        run: node scripts/check-postgres-tests.mjs /tmp/fonds-postgres-results.json

  # The npm package as a user installs it: the `fonds` command on SQLite
  # (demo, stdio MCP, loopback HTTP) and on PostgreSQL (commands, stdio MCP,
  # loopback HTTP and the hosted service), from one packed tarball.
  package:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FONDS_TEST_POSTGRES_URL: postgres://postgres:synthetic-test-only@127.0.0.1:5432/postgres
      FONDS_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same disposable server as the postgres job.
      - name: Start a disposable PostgreSQL
        run: |
          docker run -d --name fonds-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD=synthetic-test-only postgres:18.6 \
            -c jit=off -c synchronous_commit=off -c fsync=off -c full_page_writes=off
          for _ in $(seq 1 60); do
            docker exec fonds-postgres pg_isready -h 127.0.0.1 -U postgres -d postgres && exit 0
            sleep 1
          done
          exit 1
      - run: npm run check:npm

  docker:
    needs: changes
    if: needs.changes.outputs.docker != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fonds
          cache-from: type=gha,scope=fonds
          cache-to: type=gha,scope=fonds,mode=max
      - name: Smoke-test the image
        env:
          FONDS_SMOKE_SKIP_BUILD: "1"
        run: ./scripts/docker-smoke.sh
